name: LLM log-triage benchmark

# Feasibility benchmark: can small CPU-only LLMs surface the real error from noisy
# CI logs? Matrix = runner OS/arch × model × inference engine, run in parallel.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.runner }} · ${{ matrix.engine }} · ${{ matrix.model.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
        engine: [ollama, llama.cpp]
        model:
          - label: qwen2.5-coder-1.5b
            ollama: "qwen2.5-coder:1.5b"
            hf: "Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q4_K_M"
          - label: smollm2-1.7b
            ollama: "smollm2:1.7b"
            hf: "bartowski/SmolLM2-1.7B-Instruct-GGUF:Q4_K_M"
          - label: gemma4-e2b   # effective ~2B edge model (~3GB Q4)
            ollama: "gemma4:e2b"
            hf: "ggml-org/gemma-4-E2B-it-GGUF:Q4_K_M"
          - label: gemma4-e4b   # effective ~4B edge model (~4.8GB Q4)
            ollama: "gemma4:e4b"
            hf: "ggml-org/gemma-4-E4B-it-GGUF:Q4_K_M"
        exclude:
          # gemma4:e4b (~4.8GB Q4) is too tight for the M1's ~5GB usable RAM (both engines).
          - runner: macos-14
            model: {label: gemma4-e4b, ollama: "gemma4:e4b", hf: "ggml-org/gemma-4-E4B-it-GGUF:Q4_K_M"}
    env:
      RUNNER_LABEL: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pre-filter the noisy logcat
        # Input is the app-scoped logcat (upstream pid/app filter); prefilter.py then
        # strips codec/graphics noise, dedups, and caps to the token budget.
        # Falls back to the raw logcat if the app-scoped one isn't present.
        run: |
          src=test_accept_notifications.app.log
          [ -f "$src" ] || src=test_accept_notifications.log
          python bench/prefilter.py "$src" > filtered.log
          echo "Filtered $src -> $(wc -c < filtered.log) bytes"

      # ---- engine: ollama -------------------------------------------------
      - name: Install & start ollama
        if: matrix.engine == 'ollama'
        run: |
          set -e
          if [ "$RUNNER_OS" = "macOS" ]; then
            # The Homebrew formula ships ollama WITHOUT the llama-server backend
            # ("llama-server binary not found" -> 500). Use the official CLI tarball.
            curl -fsSL https://github.com/ollama/ollama/releases/latest/download/ollama-darwin.tgz -o ollama.tgz
            mkdir -p "$HOME/ollama-dist" && tar -xzf ollama.tgz -C "$HOME/ollama-dist"
            BINDIR=$(dirname "$(find "$HOME/ollama-dist" -type f -name ollama | head -1)")
            export PATH="$BINDIR:$PATH"
            echo "$BINDIR" >> "$GITHUB_PATH"
          else
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          ollama serve > ollama-serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/version && break || sleep 1
          done
          ollama pull "${{ matrix.model.ollama }}"

      - name: Run ollama benchmark
        if: matrix.engine == 'ollama'
        run: |
          set -e
          python bench/run_bench.py --engine ollama --model "${{ matrix.model.ollama }}" \
            --log filtered.log --case hard --runner-label "$RUNNER_LABEL"

      # ---- engine: llama.cpp ----------------------------------------------
      - name: Install llama.cpp
        # Prebuilt binaries only (compiling OOM-killed cc1plus on the 16GB runners).
        # macOS: Homebrew bottle (recommended). Linux: official release tarball, with
        # the tag resolved via authenticated `gh` (unauthenticated api.github.com is
        # rate-limited from Actions IPs -> empty tag -> bad URL).
        if: matrix.engine == 'llama.cpp'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install llama.cpp
            echo "LLAMA_BIN=llama-cli" >> "$GITHUB_ENV"
          else
            case "$(uname -m)" in
              x86_64)  PLAT=ubuntu-x64 ;;
              aarch64) PLAT=ubuntu-arm64 ;;
              *) echo "unsupported arch $(uname -m)"; exit 1 ;;
            esac
            TAG=$(gh release view --repo ggml-org/llama.cpp --json tagName -q .tagName)
            URL="https://github.com/ggml-org/llama.cpp/releases/download/${TAG}/llama-${TAG}-bin-${PLAT}.tar.gz"
            echo "Downloading $URL"
            mkdir -p llamacpp && curl -fsSL "$URL" | tar -xz -C llamacpp
            BIN=$(find llamacpp -type f -name llama-cli | head -1)
            echo "LLAMA_BIN=$BIN" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=$(dirname "$BIN")" >> "$GITHUB_ENV"
          fi

      - name: Run llama.cpp benchmark
        if: matrix.engine == 'llama.cpp'
        run: |
          set -e
          python bench/run_bench.py --engine llama.cpp --model "${{ matrix.model.label }}" \
            --hf-repo "${{ matrix.model.hf }}" --llama-bin "$LLAMA_BIN" \
            --log filtered.log --case hard --runner-label "$RUNNER_LABEL"

      - name: Report ollama backend (GPU vs CPU)
        if: always() && matrix.engine == 'ollama'
        run: |
          echo "### ollama backend ($RUNNER_LABEL · ${{ matrix.model.label }})" >> "$GITHUB_STEP_SUMMARY"
          # ollama logs what it discovered/selected: GPUs, library, layers offloaded.
          grep -iE 'gpu|metal|library|offload|inference compute|no compatible' ollama-serve.log \
            | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || echo "    (no backend lines found)" >> "$GITHUB_STEP_SUMMARY"
          echo "::group::ollama-serve.log (tail)"; tail -60 ollama-serve.log || true; echo "::endgroup::"

      - name: Job summary
        if: always()
        run: cat results/*.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.runner }}-${{ matrix.engine }}-${{ matrix.model.label }}
          path: results/

  aggregate:
    needs: bench
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: results
          pattern: results-*
      - name: Build leaderboard
        run: |
          python bench/aggregate.py results > SUMMARY.md
          cat SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: SUMMARY.md
