name: LLM log-triage benchmark

# Feasibility benchmark: can small CPU-only LLMs surface the real error from noisy
# CI logs? Matrix = runner OS/arch × model × inference engine, run in parallel.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.runner }} · ${{ matrix.engine }} · ${{ matrix.model.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
        engine: [ollama, llama.cpp]
        model:
          - label: qwen2.5-coder-1.5b
            ollama: "qwen2.5-coder:1.5b"
            hf: "Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q4_K_M"
          - label: smollm2-1.7b
            ollama: "smollm2:1.7b"
            hf: "bartowski/SmolLM2-1.7B-Instruct-GGUF:Q4_K_M"
          - label: gemma4-e2b   # effective ~2B edge model (~3GB Q4)
            ollama: "gemma4:e2b"
            hf: ""              # no verified GGUF yet -> excluded from llama.cpp below
          - label: gemma4-e4b   # effective ~4B edge model (~4.8GB Q4)
            ollama: "gemma4:e4b"
            hf: ""
        exclude:
          # gemma4 has no confirmed HF GGUF yet; run it on ollama only. When a GGUF
          # lands, set the model's `hf:` above and drop these two excludes.
          - engine: llama.cpp
            model: {label: gemma4-e2b, ollama: "gemma4:e2b", hf: ""}
          - engine: llama.cpp
            model: {label: gemma4-e4b, ollama: "gemma4:e4b", hf: ""}
          # gemma4:e4b (~4.8GB Q4) is too tight for the M1's ~5GB usable RAM.
          - runner: macos-14
            model: {label: gemma4-e4b, ollama: "gemma4:e4b", hf: ""}
    env:
      RUNNER_LABEL: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pre-filter the noisy logcat
        # Input is the app-scoped logcat (upstream pid/app filter); prefilter.py then
        # strips codec/graphics noise, dedups, and caps to the token budget.
        # Falls back to the raw logcat if the app-scoped one isn't present.
        run: |
          src=test_accept_notifications.app.log
          [ -f "$src" ] || src=test_accept_notifications.log
          python bench/prefilter.py "$src" > filtered.log
          echo "Filtered $src -> $(wc -c < filtered.log) bytes"

      # ---- engine: ollama -------------------------------------------------
      - name: Install & start ollama
        if: matrix.engine == 'ollama'
        run: |
          set -e
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ollama
          else
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          ollama serve > ollama-serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/version && break || sleep 1
          done
          ollama pull "${{ matrix.model.ollama }}"

      - name: Run ollama benchmark
        if: matrix.engine == 'ollama'
        run: |
          set -e
          python bench/run_bench.py --engine ollama --model "${{ matrix.model.ollama }}" \
            --log appium.log --case easy --runner-label "$RUNNER_LABEL"
          python bench/run_bench.py --engine ollama --model "${{ matrix.model.ollama }}" \
            --log filtered.log --case hard --runner-label "$RUNNER_LABEL"

      # ---- engine: llama.cpp ----------------------------------------------
      - name: Download prebuilt llama.cpp
        # Use official CPU release binaries instead of compiling (the source build
        # OOM-killed cc1plus on the 16GB runners). ~10s vs several minutes.
        if: matrix.engine == 'llama.cpp'
        run: |
          set -e
          case "$RUNNER_OS-$(uname -m)" in
            Linux-x86_64)  PLAT=ubuntu-x64 ;;
            Linux-aarch64) PLAT=ubuntu-arm64 ;;
            macOS-arm64)   PLAT=macos-arm64 ;;
            *) echo "unsupported platform $RUNNER_OS-$(uname -m)"; exit 1 ;;
          esac
          TAG=$(curl -fsSL https://api.github.com/repos/ggml-org/llama.cpp/releases/latest \
                | grep -oE '"tag_name":\s*"[^"]+"' | head -1 | grep -oE '[^"]+$')
          URL="https://github.com/ggml-org/llama.cpp/releases/download/${TAG}/llama-${TAG}-bin-${PLAT}.tar.gz"
          echo "Downloading $URL"
          mkdir -p llamacpp && curl -fsSL "$URL" | tar -xz -C llamacpp
          BIN=$(find llamacpp -type f -name llama-cli | head -1)
          echo "LLAMA_BIN=$BIN" >> "$GITHUB_ENV"
          # shared libs ship alongside the binary; make sure they're found at runtime
          echo "LD_LIBRARY_PATH=$(dirname "$BIN")" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$(dirname "$BIN")" >> "$GITHUB_ENV"

      - name: Run llama.cpp benchmark
        if: matrix.engine == 'llama.cpp'
        run: |
          set -e
          python bench/run_bench.py --engine llama.cpp --model "${{ matrix.model.label }}" \
            --hf-repo "${{ matrix.model.hf }}" --llama-bin "$LLAMA_BIN" \
            --log appium.log --case easy --runner-label "$RUNNER_LABEL"
          python bench/run_bench.py --engine llama.cpp --model "${{ matrix.model.label }}" \
            --hf-repo "${{ matrix.model.hf }}" --llama-bin "$LLAMA_BIN" \
            --log filtered.log --case hard --runner-label "$RUNNER_LABEL"

      - name: Job summary
        if: always()
        run: cat results/*.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.runner }}-${{ matrix.engine }}-${{ matrix.model.label }}
          path: results/

  aggregate:
    needs: bench
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: results
          pattern: results-*
      - name: Build leaderboard
        run: |
          python bench/aggregate.py results > SUMMARY.md
          cat SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: SUMMARY.md
